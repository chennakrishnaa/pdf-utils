<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play developer icon for venkat.app (original artwork).
  A geometric "V" monogram built from one round-capped stroke, with a coral
  dot as the brand full stop, on the Offkit ink-blue diagonal gradient.
  512 x 512, full-bleed background; all monogram content (stroke, caps and
  shadow) stays inside the central circle of radius 204.8 (80% diameter).
  make-developer-icon.py reads the V points, stroke width, dot and shadow
  offset from the elements with ids "v", "dot" and "shadow" below.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B82C6"/>
      <stop offset="0.5" stop-color="#415F91"/>
      <stop offset="1" stop-color="#284777"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- flat offset shadow, same treatment as the launcher tiles -->
  <g id="shadow" transform="translate(0 7)" fill="none" stroke="#10224A" stroke-opacity="0.28">
    <polyline points="168,176 256,342 344,176" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="348" cy="344" r="24" fill="#10224A" fill-opacity="0.28" stroke="none"/>
  </g>
  <polyline id="v" points="168,176 256,342 344,176" fill="none" stroke="#FFFFFF"
            stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="dot" cx="348" cy="344" r="24" fill="#FF7A59"/>
</svg>
